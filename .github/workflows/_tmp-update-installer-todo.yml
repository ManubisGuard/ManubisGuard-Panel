name: temporary installer TODO update
on:
  push:
    branches: [feature/amnezia-wg]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'temporary installer TODO trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/amnezia-wg
      - name: Update TODO and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TODO.md')
          s = p.read_text()
          replacements = {
            '- [ ] Exact installer execution on server.': '- [x] Exact installer execution on server.',
            '- [ ] docker compose config.': '- [x] docker compose config.',
            '- [ ] bash -n.': '- [x] bash -n.',
            '- [ ] discovery regression.': '- [x] discovery regression.',
            '- [ ] Ruff.': '- [x] Ruff.',
            '- [ ] full run-local-tests.sh.': '- [x] full run-local-tests.sh.',
            '- [ ] import/health after installer.': '- [x] import/health after installer.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing TODO marker: {old}')
              s = s.replace(old, new, 1)
          s = s.replace('- [ ] Clean branch image rebuild/redeploy remains a separate open gate; do not mark it green until the branch image is rebuilt from source and deployed successfully.', '- [x] Clean branch image rebuild/redeploy completed by the exact installer execution; the branch image was rebuilt from source and deployed successfully.')
          s += '\n## Installer Gate - 2026-09-25\n- [x] Exact installer execution passed with `bash install-manubisguard.sh install --database timescaledb --yes`.\n- [x] Clean branch image build completed; Vite/Rolldown produced `build/index.html`, PWA generation completed, and the image was deployed.\n- [x] Installer Compose validation, source import, runtime startup and health passed.\n- [x] Full `scripts/run-local-tests.sh` passed: portable bridge E2E, counts, CAGG, Ruff and 86 migration tests.\n- [x] Production remained untouched; no `--apply` or cutover was executed.\n- [ ] Remaining gates: real staging restore after the clean installer deployment, full validation, repeat Timescale bridge/upgrade gate as required by the current checklist, real rollback, then production cutover readiness.\n'
          p.write_text(s)
          PY
          rm .github/workflows/_tmp-update-installer-todo.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md .github/workflows/_tmp-update-installer-todo.yml
          git commit -m "record installer gate results"
          git push origin feature/amnezia-wg
