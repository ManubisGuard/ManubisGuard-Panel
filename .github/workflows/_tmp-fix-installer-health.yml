name: temporary installer health fix
on:
  push:
    branches: [feature/amnezia-wg]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'temporary installer health fix trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/amnezia-wg
      - name: Patch installer and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('install-manubisguard.sh')
          s = p.read_text()
          old = '  curl -kfsS --max-time 10 https://127.0.0.1:8000/health >/dev/null || die "Panel HTTPS health check failed."'
          new = '''  if grep -Eq "^[[:space:]]*PASARGUARD_SSL_ENABLED=(True|true|1)[[:space:]]*$" "$ENV_FILE"; then
            curl -kfsS --max-time 10 https://127.0.0.1:8000/health >/dev/null || die "Panel HTTPS health check failed."
          else
            curl -fsS --max-time 10 http://127.0.0.1:8000/health >/dev/null || die "Panel HTTP health check failed."
          fi'''
          if old not in s:
              raise SystemExit('expected installer health check line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/_tmp-fix-installer-health.yml
          bash -n install-manubisguard.sh
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-manubisguard.sh .github/workflows/_tmp-fix-installer-health.yml
          git commit -m "fix installer health protocol check"
          git push origin feature/amnezia-wg
