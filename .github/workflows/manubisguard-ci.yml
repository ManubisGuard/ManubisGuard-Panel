name: ManubisGuard CI

on:
  push:
    branches:
      - feature/amnezia-wg
  pull_request:
    branches:
      - feature/amnezia-wg
      - main

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Ruff check
        run: uv run ruff check app/migration tests/migration tests/compatibility scripts/manubisguard-restore-env.py

      - name: Migration shell syntax
        run: bash -n scripts/manubisguard-migrate.sh

      - name: Migration and compatibility tests
        run: uv run pytest -q tests/migration tests/compatibility
