name: ManubisGuard CI

on:
  push:
    branches:
      - feature/amnezia-wg
      - fix/restore-pasarguard-backup-architecture
  pull_request:
    branches:
      - feature/amnezia-wg
      - main

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Ruff check
        run: uv run ruff check app/migration tests/migration tests/compatibility scripts/manubisguard-restore-env.py

      - name: Migration shell syntax
        run: bash -n scripts/manubisguard-migrate.sh

      - name: Installer source-fetch regression and shell syntax
        run: bash -n install-pasarguard.sh tests/test_installer_source_fetch.sh && bash tests/test_installer_source_fetch.sh

      - name: Installer safety gates and CLI bootstrap
        run: bash tests/test_pasarguard_install_script_bootstrap.sh && bash tests/test_installer_update_gate.sh && bash tests/test_installer_update_preflight.sh

      - name: Native backup/restore architecture checks
        run: bash tests/test_native_backup_adapter.sh && bash tests/test_native_backup_transform.sh

      - name: Migration and compatibility tests
        run: uv run pytest -q tests/migration tests/compatibility
