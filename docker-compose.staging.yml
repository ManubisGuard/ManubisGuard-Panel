version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:2.28.2-pg17-oss
    container_name: manubisguard-staging-timescaledb
    environment:
      POSTGRES_DB: manubisguard
      POSTGRES_USER: manubisguard
      POSTGRES_PASSWORD: __STAGING__
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
    volumes:
      - manubisguard-staging-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manubisguard -d manubisguard"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - manubisguard-staging

volumes:
  manubisguard-staging-db:

networks:
  manubisguard-staging:
    driver: bridge
