services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manubisguard}
      POSTGRES_USER: ${POSTGRES_USER:-manubisguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /var/lib/manubisguard/timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manubisguard} -d ${POSTGRES_DB:-manubisguard}"]
      interval: 5s
      timeout: 5s
      retries: 30

  manubisguard:
    image: ghcr.io/arsamnikzaad/manubisguard-panel:feature-amnezia-wg
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    restart: always
    env_file: .env
    network_mode: host
    volumes:
      - /var/lib/manubisguard:/var/lib/manubisguard
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
